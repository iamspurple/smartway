<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Онлайн-интенсив по Smartway</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body style="margin: 0">
    <a
      class="banner"
      href="#"
      aria-label="Зарегистрироваться на онлайн-интенсив по Smartway"
    >
      <div class="banner__content">
        <div
          class="banner__date"
          aria-label="19 ноября, 12:00 по московскому времени"
        >
          <span class="banner__day">19</span>
          <span class="banner__date-details">
            <span class="banner__month">ноября</span>
            <span class="banner__time">12:00 МСК</span>
          </span>
        </div>
        <p class="banner__title">
          Онлайн-интенсив<br class="banner__line-break" />
          по Smartway
        </p>
        <span class="banner__link">
          <span class="banner__link-text">Зарегистрироваться</span>
          <span class="banner__arrow" aria-hidden="true">
            <img src="./images/arrow.svg" width="14" height="13" alt="" />
          </span>
        </span>
        <div class="banner__devices" aria-hidden="true">
          <div class="banner__tablet">
            <img src="./images/tablet.png" width="2142" height="1639" alt="" />
          </div>
          <div class="banner__phone">
            <img src="./images/phone.png" width="1419" height="2796" alt="" />
          </div>
        </div>
      </div>
    </a>
  </body>
</html>
